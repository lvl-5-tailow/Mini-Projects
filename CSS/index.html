<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="script.js"></script>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Quiz Time</h1>
            <p>Test Your Knowledge</p>
            <button id="start-btn">Start Quiz</button>
        </div>


        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2>Question goes here</h2>
                <div class="quiz-info">
                    <p>
                        Question <span id="current-question">1</span> of <span id="total-question">5</span> 
                    </p>
                    <p>
                        score : <span id="score">0</span>
                    </p>
                </div>

            </div>
            
            <div class="answers-container" id="answers-container">
            <!-- Answer buttons will be inserted here from our js code later
             at some point -->
            </div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <div class="screen" id="result-screen">
            <h1>Quiz Result</h1>
            <div class="result-info">
                <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
                <div id="result-msg">Good Job</div>
                <button>Restart Quiz</button>
            </div>
        </div>

        </div>
    </div>
</body>
</html>
